name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merrymile
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: merrymile_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, intl, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Type-check and build the front end
        run: |
          npm run types
          npm run build

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests on PostgreSQL (same as Laravel Cloud)
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: merrymile_test
          DB_USERNAME: merrymile
          DB_PASSWORD: secret
        run: vendor/bin/pest
